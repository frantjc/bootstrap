---
- name: Install kubecfg
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR KUBECONFIG"
    prepend_newline: true
    append_newline: true
    block: |
      prev_kubeconfig_state="{{ ansible_facts['env']['HOME'] }}/.kube/.prev"
      cur_kubeconfig_state="{{ ansible_facts['env']['HOME'] }}/.kube/.cur"

      default_kubeconfig="{{ ansible_facts['env']['HOME'] }}/.kube/config"

      if [ ! -f "$prev_kubeconfig_state" ]; then
        echo "$default_kubeconfig" > "$prev_kubeconfig_state"
      fi

      if [ ! -f "$cur_kubeconfig_state" ]; then
        echo "$default_kubeconfig" > "$cur_kubeconfig_state"
      fi

      export KUBECONFIG="$(cat "$cur_kubeconfig_state")"

      kubeconfigd="{{ ansible_facts['env']['HOME'] }}/.kube/config.d"

      mkdir -p "$kubeconfigd"

      kubecfg () {
        local prev_kubeconfig="${KUBECONFIG:-"$default_kubeconfig"}" selected
        if [[ "$1" == "-" ]]; then
          export KUBECONFIG="$(cat "$prev_kubeconfig_state")"
          echo "$KUBECONFIG" > "$cur_kubeconfig_state"
          echo "$prev_kubeconfig" > "$prev_kubeconfig_state"
        elif [[ $(find "$kubeconfigd" -type f | wc -l) -gt 0 ]]; then
          selected="$(find "$kubeconfigd" -type f | fzf)" || return 0
          [[ -n "$selected" ]] || return 0
          export KUBECONFIG="$selected"
          echo "$KUBECONFIG" > "$cur_kubeconfig_state"
          echo "$prev_kubeconfig" > "$prev_kubeconfig_state"
        else
          echo "no files found in ${kubeconfigd}"
        fi
      }

- name: Uninstall k9s plugins
  vars:
  ansible.builtin.copy:
    src: k9s/plugins/
    dest: "{{ (bootstrap_env | default(ansible_facts['env']))['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] + '/.config') }}/k9s/plugins"
    mode: "0644"
    state: absent

- name: Install sofka plugins
  vars:
  ansible.builtin.command:
    cmd: sofka plugin install trivy
