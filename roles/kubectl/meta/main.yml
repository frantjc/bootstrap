        - kubectx@0.9.5
        - kubens@0.9.5
        - trivy@0.76.0
        - yq@4.52.4
      mise_shell_aliases:
        k: kubectl
        k9: sofka
        k9s: sofka
        kcfg: kubecfg
        kctx: kubectx
        kns: kubens
